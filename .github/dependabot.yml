# Dependabot configuration — weekly scan for vulnerable / out-of-date
# dependencies across both apps and the GitHub Actions workflow.
#
# Grouping strategy: related packages that must be version-aligned (e.g.
# every `@nestjs/*` pin at the same minor) are grouped into a single PR
# so Dependabot doesn't propose a partial upgrade that breaks peer-dep
# compatibility. Unrelated production deps get individual PRs so each
# can be triaged and merged (or rejected) on its own merits.
#
# Earlier version of this file grouped ALL `dependency-type: production`
# into one PR, which produced unmergeable 25-dep mega-PRs. This file is
# the reviewable-granularity replacement.
#
# Ignore policy for major bumps: tools that need an explicit migration
# (eslint, jest, the test runners) are pinned at the current major
# until someone schedules a dedicated upgrade. Without these ignores,
# Dependabot re-opens the same major PR every week with red CI, and
# the noise drowns out the genuine patch/minor bumps we care about.
version: 2
updates:
  # ─── Root package.json ─────────────────────────────────────────────
  # The actual root deps are tiny: turbo + npm-run-all + concurrently.
  # Earlier this section used `dependency-type: development`, which
  # greedily bundled every workspace dev-dep into one PR (the source
  # of the recurring "root-dev-dependencies group with N updates"
  # mega-PR that mixed eslint + jest + playwright). Constrain to the
  # actual root packages so this entry can't pull in workspace deps
  # via the shared lockfile resolution.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      root-dev-dependencies:
        patterns: ["turbo", "concurrently", "npm-run-all"]

  # ─── API (NestJS backend) ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 15
    labels: [dependencies, api]
    groups:
      # Framework & peer-aligned packages get bundled.
      nestjs:
        patterns: ["@nestjs/*"]
      prisma:
        patterns: ["@prisma/*", "prisma"]
      sentry:
        patterns: ["@sentry/*"]
      # Type definitions — always grouped; never breaking on their own.
      types:
        patterns: ["@types/*"]
      # Test harness — jest + supertest + ts-jest usually bumped together.
      testing:
        patterns: ["jest", "jest-*", "ts-jest", "@types/jest", "supertest", "@types/supertest"]
      # Linters — safe to batch; failures surface together.
      linting:
        patterns: ["eslint", "eslint-*", "@typescript-eslint/*", "prettier"]
    # Everything else (openai, razorpay, firebase-admin, ioredis, bcrypt,
    # swisseph, etc.) gets an individual PR — these have subtle breaking
    # changes and deserve per-package review.
    ignore:
      # Major version bumps on critical deps need explicit human review.
      # Comment these out when actively upgrading. Security advisories
      # still produce PRs regardless of this ignore list.
      - dependency-name: "openai"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: "prisma"
        update-types: [version-update:semver-major]
      # Test runner — Jest 30 ships breaking config + ESM changes that
      # need a deliberate migration (jest.config.ts, jest-environment-*,
      # snapshot serializer changes). Stay on jest 29 until we schedule
      # the upgrade. `@types/jest` is tied to jest's major so it's
      # ignored alongside.
      - dependency-name: "jest"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/jest"
        update-types: [version-update:semver-major]
      # `@types/uuid` 11.x is a major bump on the typings package
      # (not the runtime). Pin to 10.x until the runtime `uuid`
      # package goes major in this codebase, so the type+runtime
      # pair stays aligned.
      - dependency-name: "@types/uuid"
        update-types: [version-update:semver-major]

  # ─── Web (Next.js frontend) ────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 15
    labels: [dependencies, web]
    groups:
      # Next.js ecosystem — framework + analyzer + bundled ESLint config.
      nextjs:
        patterns: ["next", "@next/*", "eslint-config-next"]
      # React + types, always version-matched.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      sentry:
        patterns: ["@sentry/*"]
      playwright:
        patterns: ["@playwright/*", "playwright"]
      types:
        patterns: ["@types/*"]
      linting:
        patterns: ["eslint", "eslint-*", "@typescript-eslint/*", "prettier"]
      # Styling / animation / UI libs that version-drift together.
      styling:
        patterns: ["tailwindcss", "@tailwindcss/*", "autoprefixer", "postcss", "framer-motion", "motion"]
    # Zustand, firebase, razorpay, clsx, lucide-react, etc. — each
    # gets its own PR.
    ignore:
      - dependency-name: "next"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
        update-types: [version-update:semver-major]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-major]
      # ESLint 10 dropped support for several plugin APIs we use through
      # eslint-config-next; the migration is a half-day's work that
      # belongs in its own PR. Stay on eslint 9 until then.
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]

  # ─── GitHub Actions versions ───────────────────────────────────────
  # Monthly is enough; major bumps (e.g. checkout v4→v5) can still open
  # out-of-cycle if there's a security advisory.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["actions/*"]

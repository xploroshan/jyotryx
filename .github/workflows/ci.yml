name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test-api:
    name: API — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # `pgvector/pgvector:pg16` is the upstream pgvector image built on
        # the official `postgres:16` base — same engine, with the `vector`
        # extension pre-bundled. Migration `20260412_add_pgvector` does
        # `CREATE EXTENSION vector`, which fails on plain `postgres:16-alpine`
        # (extension not available) and silently passed before only because
        # the dev environment happened to have it installed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: myastro360
          POSTGRES_PASSWORD: myastro360_test
          POSTGRES_DB: myastro360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U myastro360"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://myastro360:myastro360_test@localhost:5432/myastro360_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma — generate client
        working-directory: apps/api
        run: npx prisma generate
      - name: Prisma — migrate deploy
        working-directory: apps/api
        # CI doesn't ship a separate direct URL; the `prisma.config.ts`
        # `datasource.url` falls back to `DATABASE_URL`, but mirroring
        # `DIRECT_URL` here keeps the migrate engine's selection logic
        # identical to the Supabase production env (where DIRECT_URL is
        # the non-pooled connection that migrations must use).
        env:
          DIRECT_URL: postgresql://myastro360:myastro360_test@localhost:5432/myastro360_test?schema=public
        run: npx prisma migrate deploy
      - name: Lint API
        run: cd apps/api && npx nest build
      - name: Typecheck API (incl. tests)
        # nest build typechecks src; jest runs ts-jest transpile-only, so test
        # files are NOT typechecked by it. tsconfig.spec.json covers src + tests
        # so type regressions in specs can't merge silently.
        run: cd apps/api && npx tsc --noEmit -p tsconfig.spec.json
      - name: Test API
        run: cd apps/api && npm test
      - name: Install integration-test daemons
        # The integration suite spawns its own postgres / pgbouncer /
        # redis on random ports (see test/integration/infra/*) — it does
        # NOT use the service containers above. The binaries aren't on
        # `ubuntu-latest` by default, and the apt packages auto-start
        # default clusters on 5432 / 6379 which would clash with the
        # service-container ports, so we stop them after install. The
        # spawn helpers find binaries via `/usr/lib/postgresql/16/bin`.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            redis-server \
            postgresql-16 \
            postgresql-16-pgvector \
            pgbouncer
          sudo systemctl stop postgresql || true
          sudo systemctl stop redis-server || true
          sudo systemctl stop pgbouncer || true
      - name: Integration test API
        run: cd apps/api && npm run test:int

  security-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: npm audit (high + critical)
        # `|| true` so low/moderate advisories don't block merges; we want
        # the report in the job log for triage, but only high/critical
        # fails the build. Gate can tighten once the noise floor is known.
        run: |
          npm audit --omit=dev --audit-level=high || AUDIT_EXIT=$?
          if [ "${AUDIT_EXIT:-0}" = "0" ]; then
            echo "No high/critical advisories."
          else
            echo "::error::npm audit found high/critical advisories"
            exit $AUDIT_EXIT
          fi

  build-and-test-web:
    name: Web — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint Web
        run: cd apps/web && npm run lint
      - name: Typecheck Web (incl. tests)
        # next build typechecks app/pages source but not the e2e/__tests__
        # suites; an explicit tsc --noEmit covers them so type regressions in
        # tests fail CI instead of merging.
        run: cd apps/web && npx tsc --noEmit
      - name: Build Web
        run: cd apps/web && npx next build
        env:
          SENTRY_SUPPRESS_INSTRUMENTATION_FILE_WARNING: "1"
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: "1"
      - name: Test Web
        run: cd apps/web && npm test
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 1
          # `.next` is dot-prefixed; upload-artifact@v4 excludes hidden
          # paths by default, so without this the artifact is empty and
          # the downstream Lighthouse / Bundle Size jobs can't download it.
          include-hidden-files: true

  e2e-web:
    name: Web — E2E (Playwright)
    needs: build-and-test-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        # Covers the a11y sweep (axe-core) and the route-focus reset
        # contract — the two regressions that shipped because unit-level
        # tests can't reproduce real browser focus/accessibility state.
        run: cd apps/web && npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e-web-realapi:
    name: Web — Full-stack E2E (real API)
    needs: build-and-test-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Install self-spawned daemons
        # The real-API E2E boots its OWN Postgres/Redis on ephemeral ports via
        # the integration infra helpers (test/integration/infra/*) — same as
        # the integration suite — so it needs the binaries on PATH, not the
        # service containers. Stop the auto-started default clusters so the
        # spawn helpers own the ports.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server postgresql-16 postgresql-16-pgvector pgbouncer
          sudo systemctl stop postgresql || true
          sudo systemctl stop redis-server || true
          sudo systemctl stop pgbouncer || true
      - name: Prisma — generate client
        working-directory: apps/api
        run: npx prisma generate
      - name: Pre-build API
        # global-setup skips its own `nest build` when dist/main.js exists,
        # so building here keeps the Playwright webServer startup window from
        # being eaten by a cold compile.
        working-directory: apps/api
        run: npx nest build
      - name: Run full-stack E2E
        working-directory: apps/web
        run: npm run test:e2e:realapi
        env:
          CI: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-realapi-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: build-and-test-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.js
          uploadArtifacts: true

  bundle-size:
    name: Bundle Size Check
    needs: build-and-test-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build with analyzer
        run: cd apps/web && ANALYZE=true npx next build
        env:
          SENTRY_SUPPRESS_INSTRUMENTATION_FILE_WARNING: "1"
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: "1"
      - name: Check bundle budgets
        run: |
          cd apps/web
          node -e "
            const fs = require('fs');
            const path = require('path');
            const budgets = JSON.parse(fs.readFileSync('budget.json', 'utf8'));
            const { globSync } = require('glob');
            let failed = false;
            for (const budget of budgets) {
              const maxBytes = parseInt(budget.maxSize) * 1024;
              const files = globSync(budget.path);
              for (const file of files) {
                const size = fs.statSync(file).size;
                const sizeKB = (size / 1024).toFixed(1);
                if (size > maxBytes) {
                  console.error('OVER BUDGET: ' + file + ' (' + sizeKB + 'kB > ' + budget.maxSize + ')');
                  failed = true;
                }
              }
            }
            if (failed) process.exit(1);
            console.log('All chunks within budget.');
          "

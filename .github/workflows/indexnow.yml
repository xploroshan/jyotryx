name: IndexNow

# Submit the live sitemap's URLs to IndexNow (Bing, Yandex, Seznam, Naver —
# which also feed ChatGPT/Copilot search) so new/changed pages get crawled
# promptly. Google does NOT use IndexNow — submit the sitemap in Search Console
# for Google (see docs/seo.md).
#
# Run it WITHOUT a terminal:
#   GitHub → Actions → "IndexNow" → "Run workflow".
# It also runs automatically once a week to keep the index fresh.
#
# No secrets needed: the IndexNow key is public by design (it's hosted at
# /<key>.txt on the site). Override SITE_ORIGIN / INDEXNOW_KEY as inputs if the
# domain or key ever change.

on:
  workflow_dispatch:
    inputs:
      site_origin:
        description: "Site origin to submit (no trailing slash)"
        required: false
        default: "https://www.myastro360.com"
  # Deploy-completion trigger: point a Vercel deploy webhook (or any bridge)
  # at GitHub's repository_dispatch API with this event type, and new/changed
  # pages get pinged within minutes of going live — which is IndexNow's whole
  # point. Wiring the sender is a one-time owner step (see docs/seo runbook);
  # until then the daily cron below is the fallback cadence.
  repository_dispatch:
    types: [deploy-succeeded]
  schedule:
    # Daily 01:00 UTC (06:30 IST) — right after the panchang/horoscope pages
    # roll over to the new IST day, so the daily-changing URLs are re-pinged
    # when their content has actually changed.
    - cron: "0 1 * * *"

# Don't pile up overlapping submissions.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    name: Submit sitemap URLs to IndexNow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Submit
        env:
          SITE_ORIGIN: ${{ github.event.inputs.site_origin || 'https://www.myastro360.com' }}
        run: node apps/web/scripts/indexnow-submit.mjs

name: Instagram daily post

on:
  schedule:
    # Daily 02:00 UTC (07:30 IST) — generate and (draft|publish) the day's post.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Post mode"
        type: choice
        options: [draft, publish]
        default: draft
      dry_run:
        description: "Dry run (no side effects)"
        type: boolean
        default: false

concurrency:
  group: instagram-daily
  cancel-in-progress: false

jobs:
  daily-post:
    name: Generate & post
    runs-on: ubuntu-latest
    # Master kill switch: repo variable SOCIAL_ENGINE_ENABLED must be 'true'.
    if: ${{ vars.SOCIAL_ENGINE_ENABLED == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run daily post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MYASTRO_API_URL: ${{ vars.MYASTRO_API_URL }}
          SOCIAL_MODE: ${{ inputs.mode || vars.SOCIAL_ENGINE_MODE || 'draft' }}
          DRY_RUN: ${{ inputs.dry_run }}
          TZ: Asia/Kolkata
        run: node scripts/social/daily-post.mjs
      - name: Commit artifacts
        # Persist drafts / queue / log changes back to the branch the run
        # checked out. Guard against empty commits: only commit when git
        # actually reports changes under marketing/social/.
        run: |
          if [ -n "$(git status --porcelain -- marketing/social/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add marketing/social/
            git commit -m "chore(social): daily post artifacts $(date +%Y-%m-%d)"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No social artifacts to commit."
          fi

name: Instagram weekly insights

on:
  schedule:
    # Sundays 03:00 UTC (08:30 IST) — pull last week's insights.
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: instagram-weekly
  cancel-in-progress: false

jobs:
  weekly-insights:
    name: Fetch insights
    runs-on: ubuntu-latest
    # Master kill switch: repo variable SOCIAL_ENGINE_ENABLED must be 'true'.
    if: ${{ vars.SOCIAL_ENGINE_ENABLED == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run weekly insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MYASTRO_API_URL: ${{ vars.MYASTRO_API_URL }}
          TZ: Asia/Kolkata
        run: node scripts/social/weekly-insights.mjs
      - name: Commit artifacts
        # Guard against empty commits: only commit when git reports changes
        # under marketing/social/.
        run: |
          if [ -n "$(git status --porcelain -- marketing/social/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add marketing/social/
            git commit -m "chore(social): weekly insights $(date +%Y-%m-%d)"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No social artifacts to commit."
          fi

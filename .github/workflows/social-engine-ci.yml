name: Social engine CI

on:
  pull_request:
    paths:
      - "scripts/social/**"
      - "marketing/social/templates/**"
      - "marketing/social/queue/**"
      - ".github/workflows/instagram-*.yml"
      - ".github/workflows/social-engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/social/**"
      - "marketing/social/templates/**"
      - "marketing/social/queue/**"
      - ".github/workflows/instagram-*.yml"
      - ".github/workflows/social-engine-ci.yml"

concurrency:
  group: social-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Social engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run social:test

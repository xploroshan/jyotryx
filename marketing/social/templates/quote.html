<html lang="en">
<head>
<meta charset="utf-8">
<title>MyAstro360 — Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,800;1,500;1,600;1,800&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="_brand.css">
<style>
  /* Quote sits in the vertical middle; footer stays pinned to the bottom. */
  .quote-well {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Oversized opening quote mark — pure typography, no imagery. */
  .quote-glyph {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 160px;
    line-height: 0.6;
    color: var(--gold);
    opacity: 0.85;
  }

  /* HERO — the quote. Must read at 200px-wide thumbnail. */
  .quote {
    margin-top: 44px;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 76px;
    line-height: 1.22;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    max-width: 880px;
  }

  .quote-well .rule {
    margin-top: 56px;
  }

  .attribution {
    margin-top: 40px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
  }
</style>
</head>

<div class="canvas star-dots">

  <div class="quote-well">
    <p class="quote-glyph" aria-hidden="true">&ldquo;</p>
    <blockquote class="quote">{{quote}}</blockquote>
    <hr class="rule rule--short">
    <p class="attribution">{{attribution}}</p>
  </div>

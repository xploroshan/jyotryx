<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyAstro360 — Myth-bust carousel slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,800;1,500;1,600;1,800&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="_brand.css">
<style>
  /* One slide per render. {{variant}} lands on .canvas: cover | content | closer */

  .slide-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 40px;
  }

  .slide-count {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* HERO — the headline. Must read at 200px-wide thumbnail. */
  .headline {
    margin-top: 48px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 84px;
    line-height: 1.08;
    letter-spacing: -0.015em;
    color: var(--text-primary);
    max-width: 880px;
  }

  /* Body: renderer passes short <p> paragraphs via the raw slot. */
  .body {
    margin-top: 52px;
    max-width: 860px;
  }

  .body p {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 32px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  .body p + p {
    margin-top: 30px;
  }

  /* Progress dots: renderer emits e.g.
     <span class="dot dot--on"></span><span class="dot"></span>... */
  .dots {
    margin-top: auto;
    padding-top: 48px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .dots .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(245, 236, 216, 0.25);
  }

  .dots .dot--on {
    background: var(--gold);
  }

  .canvas .footer {
    margin-top: 0;
  }

  /* ---- Variant: cover — typographically bigger, sets the hook ---------- */
  .cover .headline {
    margin-top: 120px;
    font-size: 120px;
    line-height: 1.04;
    letter-spacing: -0.02em;
  }

  .cover .body p {
    font-size: 36px;
    color: var(--text-primary);
  }

  /* ---- Variant: closer — carries the CTA -------------------------------- */
  .closer .headline {
    font-size: 96px;
  }

  .closer .body p {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 44px;
    line-height: 1.3;
    color: var(--gold-3);
  }
</style>
</head>

    <p class="slide-count">{{slide_no}} / {{total}}</p>

  <h1 class="headline">{{headline}}</h1>

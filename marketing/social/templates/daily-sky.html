<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyAstro360 — Today's Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,800;1,500;1,600;1,800&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="_brand.css">
<style>
  .date {
    margin-top: 28px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 52px;
    line-height: 1.15;
    color: var(--text-primary);
  }

  .sky-grid {
    margin: 56px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 44px 56px;
  }

  .sky-grid .cell__label {
    font-size: 22px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--text-muted);
  }

  .sky-grid .cell__value {
    margin-top: 12px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 44px;
    line-height: 1.15;
    color: var(--text-secondary);
  }

  /* HERO — the Rahu Kaal window. Must read at 200px-wide thumbnail. */
  .hero {
    margin-top: 56px;
  }

  .hero__label {
    font-size: 28px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--gold-3);
  }

  .hero__value {
    margin-top: 16px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 132px;
    line-height: 1.02;
    letter-spacing: -0.02em;
  }

  .footnote {
    margin-top: 28px;
    font-size: 24px;
    font-weight: 400;
    line-height: 1.45;
    color: var(--text-muted);
    max-width: 820px;
  }
</style>
</head>
<body>
<div class="canvas star-dots">

  <p class="eyebrow">Today's Sky &middot; {{city}}</p>
  <h1 class="date">{{date_label}}</h1>

  <div class="sky-grid">
    <div class="cell">
      <p class="cell__label">Tithi</p>
      <p class="cell__value">{{tithi}}</p>
    </div>
    <div class="cell">
      <p class="cell__label">Nakshatra</p>
      <p class="cell__value">{{nakshatra}}</p>
    </div>
    <div class="cell">
      <p class="cell__label">Sunrise</p>
      <p class="cell__value">{{sunrise}}</p>
    </div>
    <div class="cell">
      <p class="cell__label">Sunset</p>
      <p class="cell__value">{{sunset}}</p>
    </div>
  </div>

  <hr class="rule">

  <div class="hero">
    <p class="hero__label">Rahu Kaal</p>
    <p class="hero__value grad-text">{{rahu_kaal}}</p>
    <p class="footnote">{{footnote}}</p>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Outer ring - celestial orbit -->
  <circle cx="20" cy="20" r="18" stroke="url(#ring-grad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner glow circle -->
  <circle cx="20" cy="20" r="12" fill="url(#center-grad)" opacity="0.15"/>
  <!-- Central star/sun symbol -->
  <circle cx="20" cy="20" r="5" fill="url(#star-grad)"/>
  <!-- Radiating lines - cardinal directions -->
  <line x1="20" y1="3" x2="20" y2="10" stroke="url(#ray-grad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="30" x2="20" y2="37" stroke="url(#ray-grad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3" y1="20" x2="10" y2="20" stroke="url(#ray-grad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="20" x2="37" y2="20" stroke="url(#ray-grad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Diagonal rays -->
  <line x1="7.98" y1="7.98" x2="12.73" y2="12.73" stroke="url(#ray-grad)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="27.27" y1="27.27" x2="32.02" y2="32.02" stroke="url(#ray-grad)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="32.02" y1="7.98" x2="27.27" y2="12.73" stroke="url(#ray-grad)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="12.73" y1="27.27" x2="7.98" y2="32.02" stroke="url(#ray-grad)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Small orbital dots -->
  <circle cx="20" cy="3.5" r="1.5" fill="#818cf8"/>
  <circle cx="36.5" cy="20" r="1.2" fill="#a78bfa" opacity="0.7"/>
  <circle cx="8" cy="33" r="1" fill="#c4b5fd" opacity="0.5"/>
  <defs>
    <linearGradient id="star-grad" x1="15" y1="15" x2="25" y2="25">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="2" y1="2" x2="38" y2="38">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ray-grad" x1="20" y1="3" x2="20" y2="37">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="center-grad" cx="20" cy="20" r="12">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

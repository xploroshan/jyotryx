apiVersion: v1
kind: ConfigMap
metadata:
  name: myastro360-config
  namespace: myastro360
data:
  NODE_ENV: "production"
  PORT: "4000"
  CORS_ORIGIN: "https://www.myastro360.com"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "60"
  NEXT_TELEMETRY_DISABLED: "1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring:4318"
  LLM_FAILOVER_ENABLED: "true"
  GEMINI_MODEL: "gemini-2.0-flash"
  GEMINI_MODEL_VISION: "gemini-2.0-flash"
  # Read replica URL for analytics (set in secrets for production)
  # DATABASE_READ_REPLICA_URL: ""
  # Data retention: months to keep partitioned data before dropping
  DATA_RETENTION_MONTHS: "6"

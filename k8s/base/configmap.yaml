apiVersion: v1
kind: ConfigMap
metadata:
  name: jyotryx-config
  namespace: jyotryx
data:
  NODE_ENV: "production"
  PORT: "4000"
  CORS_ORIGIN: "https://www.jyotron.com"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "60"
  NEXT_TELEMETRY_DISABLED: "1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring:4318"

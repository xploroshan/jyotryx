apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: jyotryx
  labels:
    app: worker
    app.kubernetes.io/part-of: jyotryx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/part-of: jyotryx
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/xploroshan/jyotryx-api:latest
          command: ["node", "dist/main", "--worker"]
          envFrom:
            - configMapRef:
                name: jyotryx-config
            - secretRef:
                name: jyotryx-secrets
          env:
            - name: WORKER_MODE
              value: "true"
          readinessProbe:
            exec:
              command: ["sh", "-c", "node -e 'process.exit(0)'"]
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "node -e 'process.exit(0)'"]
            initialDelaySeconds: 15
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
